<div class="newsletter__shapes">
  {% if pattern_id == "newsletter-right" %}
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path fill="var(--green)" d="M0 0h100a50 50 0 0 1-100 0Z" />
      <path fill="var(--red)" d="M0 50h100a50 50 0 0 1-100 0Z" />
    </svg>
    <svg viewBox="0 0 50 100" aria-hidden="true" focusable="false">
      <path fill="var(--orange)" d="M0 0a50 50 0 0 1 0 100Z" />
    </svg>
    <svg viewBox="0 0 50 100" aria-hidden="true" focusable="false">
      <path fill="var(--red)" d="M0 0a50 50 0 0 1 0 100Z" />
    </svg>
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <circle fill="var(--orange)" cx="50" cy="50" r="50" />
    </svg>
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path fill="var(--blue)" d="M0 0h100v100H0z" />
    </svg>
  {% else %}
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path fill="var(--orange)" d="M0 0h100v100H0z" />
    </svg>
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <path fill="var(--red)" d="M0 0h100a50 50 0 0 1-100 0ZM0 100a50 50 0 0 1 100 0Z" />
    </svg>
    <svg viewBox="0 0 50 100" aria-hidden="true" focusable="false">
      <path fill="var(--blue)" d="M0 0a50 50 0 0 1 0 100Z" />
    </svg>
    <svg viewBox="0 0 50 100" aria-hidden="true" focusable="false">
      <path fill="var(--yellow)" d="M50 0v100a50 50 0 0 1 0-100Z" />
    </svg>
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <circle fill="var(--orange)" cx="50" cy="50" r="50" />
    </svg>
  {% endif %}
</div>
