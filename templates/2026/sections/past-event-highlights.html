{% block head %}
  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.4.0/lite-yt-embed.min.js"
    integrity="sha512-UIa88sNMfONNEzy5lOstv0HFqAD6NwUBrYN9rofJBjemLx+kY17IHyHpzpeFlYLXJk0zzEn5Tx6DkXya0rc8ow=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/lite-youtube-embed/0.4.0/lite-yt-embed.min.css"
    integrity="sha512-HTcimqa25P77k16KHtHursC/Cajm0XfNolRYlHpRHQZoEO6UU+VVkGyZqbqX8LkZMCvRZ8MZDbeMzS6l5DK0IA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
{% endblock head %}

<section class="past-event-highlights">
  <h1>2025 Highlights</h1>
  <div class="past-event-highlights__content">
    <div class="past-event-highlights__grid">
      <div class="past-event-highlights__image">
        <img src="/2026/images/camera.webp" alt="Video camera" width="320" height="281" loading="lazy" />
      </div>
      <div class="past-event-highlights__video">
        <lite-youtube
          videoid="0upKjWbvSi0"
          style="background-image: url('https://i.ytimg.com/vi/0upKjWbvSi0/maxresdefault.jpg');"
        >
          <a href="https://youtube.com/watch?0upKjWbvSi0" class="lty-playbtn" title="Play Video">
            <span class="lyt-visually-hidden">Play Video: Keynote (Google I/O '18)</span>
          </a>
        </lite-youtube>
      </div>
    </div>
  </div>
</section>
