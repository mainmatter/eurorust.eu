<section class="hero">
  <div class="hero__content">
    <img class="hero__logo" src="/images/EuroRust2027_logo_horizontal.svg" alt="EuroRust" width="529" height="90" />
    <p class="hero__year">2027</p>
    <p class="hero__date">{{ section.extra.dates }} | Prague and online</p>
    <div class="hero__intro">
      <h1>We cover all things rust</h1>
      <p>Two conference days and two days of fun side events, hackathons and exploring Prague.</p>
    </div>
    <div class="hero__actions">
      <a href="{{ section.extra.ticket_url }}" class="button-primary">Get your Early Bird ticket</a>
      <a href="mailto:mail@eurorust.eu?subject=EuroRust%202027%20sponsorship" class="button-secondary"
        >Become a sponsor</a
      >
    </div>
  </div>
  <div class="hero__canvas">
    <span class="hero__circle-yellow" aria-hidden="true"></span>
    <span class="hero__circle-red" aria-hidden="true"></span>
    <span class="hero__square" aria-hidden="true"></span>
    <span class="hero__triangle" aria-hidden="true"></span>
    <canvas role="img" aria-label="Glossy red Ferris on a blue platform"></canvas>
    <img
      class="hero__fallback"
      src="/images/bauhaus_ferris.webp"
      alt="Glossy red Ferris on a blue platform"
      width="1600"
      height="1600"
    />
    <noscript>
      <style>
        .hero__canvas canvas {
          display: none;
        }
        .hero__canvas .hero__fallback {
          display: block;
        }
      </style>
    </noscript>
  </div>
</section>
