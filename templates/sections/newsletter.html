<section class="newsletter">
  <div class="newsletter__mobile-art" aria-hidden="true">
    <span class="pattern pattern--quarter"></span>
    <span class="pattern pattern--dots"></span>
    <span class="pattern pattern--stripes"></span>
    <span class="pattern pattern--quarter"></span>
  </div>
  <div class="newsletter__wrapper container">
    <h2>Join our<br />mailing list</h2>

    <div id="mc_embed_shell">
      <div id="mc_embed_signup">
        <form
          action="https://eurorust.us13.list-manage.com/subscribe?u=50bd3378ab1da4988aa174d0b&amp;id=9fea27d1b4&amp;f_id=00c693e8f0"
          method="post"
          id="mc-embedded-subscribe-form"
          name="mc-embedded-subscribe-form"
          target="_blank"
        >
          <div id="mc_embed_signup_scroll">
            <div class="mc-field-group">
              <label for="mce-EMAIL">Email address</label>
              <input
                placeholder="Your email"
                type="email"
                autocomplete="email"
                name="EMAIL"
                class="required email"
                id="mce-EMAIL"
                required=""
                value=""
              />
            </div>

            <div hidden=""><input type="hidden" name="tags" value="7273288" /></div>
            <div aria-hidden="true" style="position: absolute; left: -5000px;">
              <input type="text" name="b_50bd3378ab1da4988aa174d0b_9fea27d1b4" tabindex="-1" value="" />
            </div>
            <div class="clear">
              <input
                type="submit"
                name="subscribe"
                id="mc-embedded-subscribe"
                class="button-primary"
                value="Subscribe"
              />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="newsletter__art" aria-hidden="true">{% include "partials/bauhaus-pattern.html" %}</div>
</section>
